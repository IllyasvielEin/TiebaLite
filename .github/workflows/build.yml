name: Build learning APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            "$ANDROID_HOME/platforms/android-36/android.jar" \
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            "$ANDROID_HOME/licenses/android-sdk-license"; do
            if ! test -s "$required"; then
              echo "::error::Required preinstalled SDK file is missing: $required"
              exit 1
            fi
          done
          if test -e keystore.properties; then
            echo "::error::This unsigned workflow must not contain keystore.properties"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Validate wrapper and set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Run artifact and source regressions
        run: |
          python3 scripts/test_build_metadata.py
          python3 scripts/test_validation_reports.py
          python3 app/src/test/security/check_privacy_boundaries.py
          python3 app/src/test/compatibility/check_compose_compatibility.py

      - name: Test and build unsigned release
        run: ./gradlew --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease

      - name: Prepare verifiable archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/artifact
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} out/artifact/ \;
          compgen -G 'out/artifact/*.apk' > /dev/null
          for apk in out/artifact/*.apk; do
            if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
              echo "Unexpected signed APK in unsigned learning workflow" >&2
              exit 1
            fi
          done
          cp app/build/outputs/apk/release/output-metadata.json out/artifact/
          if test -f app/build/outputs/mapping/release/mapping.txt; then
            cp app/build/outputs/mapping/release/mapping.txt out/artifact/
          fi
          python3 scripts/build_metadata.py out/artifact/build-metadata.json
          printf '%s\n' 'UNSIGNED-EXPERIMENTAL-not-login-validated' 'Build proof only: full lint runs after this archive and may still fail. Check the run and separate reports.' 'Authenticated HTTP risks remain unresolved; this is not approved for real-account login.' 'Sign with your own approved key before installation. This workflow does not store or generate signing keys.' > out/artifact/README.txt
          (cd out/artifact && sha256sum -- * > SHA256SUMS)

      - name: Upload learning artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UNSIGNED-EXPERIMENTAL-not-login-validated-${{ github.sha }}-${{ github.run_attempt }}
          path: out/artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Full Android lint (blocking quality gate)
        run: ./gradlew --no-daemon --stacktrace :app:lintRelease

      - name: Collect filtered validation reports
        if: ${{ always() }}
        run: python3 scripts/collect_validation_reports.py

      - name: Upload validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: out/validation-reports/
          if-no-files-found: warn
          retention-days: 7
